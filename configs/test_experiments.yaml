# Default configuration for post-training circuit intervention experiments.
# A user-provided --config file is recursively merged over these values.

input:
  # Training metadata JSON produced by trainer.py.
  results_file: "results/test_model_training_metadata.json"

  # Optional DAG override. When null, experiments.py first tries the portable
  # graph path saved in effective_config, then the saved resolved absolute path.
  graph_file: null

experiments:
  # At least one experiment must be enabled. Keeping the baseline enabled is
  # recommended because intervention effects are reported relative to it.
  baseline: true
  single_gene: true
  single_edge: true

  # Every condition is sampled once per repetition. For Aer, repetition r uses
  # execution.seed_simulator + r, starting with r = 0.
  repetitions: 3


transpilation:
  optimization_level: 2
  seed_transpiler: 42
  options: {}

output:
  # Do not include an extension. Both .csv and .json are written from this stem.
  file_stem: "results/test_intervention_experiments"
  show_progress: true
